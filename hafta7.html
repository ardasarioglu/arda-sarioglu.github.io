<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafta 7 - Bootstrap & JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="hafta7.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">WP Lab</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Ana Sayfa</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row align-items-center">
            <div class="col-md-7">
                <h1 class="display-4 fw-bold">Etkinlik Kayıt Sayfası</h1>
                <p class="lead text-secondary">Bootstrap ve JS ile dinamik bir deneyim.</p>
                <button class="btn btn-primary btn-lg" onclick="location.href='#kayit-formu'">Başvuru Formuna Git</button>
                <button id="temaButonu" class="btn btn-outline-secondary btn-lg">Temayı Değiştir</button>
            </div>
        </div>
    </div>

    <div class="container my-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0 rounded-4">
                    <div class="card-body">
                        <span class="badge bg-primary mb-2">01</span>
                        <h5 class="card-title">Responsive Tasarım</h5>
                        <p class="card-text text-secondary">Grid sistemiyle her cihaza uyumlu arayüzler.</p>
                    </div>
                </div>
            </div>
            </div>
    </div>

    <div id="kayit-formu" class="container py-5 bg-light rounded-4 shadow-sm">
        <h2 class="mb-4">Başvuru Formu</h2>
        <form id="etkinlikFormu">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Ad Soyad</label>
                    <input type="text" id="adSoyad" class="form-control" placeholder="Adınızı giriniz">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">E-posta</label>
                    <input type="email" id="eposta" class="form-control" placeholder="Örn: ad@mail.com">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Katılım Türü</label>
                <select id="katilimTuru" class="form-select">
                    <option value="">Seçiniz...</option>
                    <option value="Yüz yüze">Yüz yüze</option>
                    <option value="Online">Online</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">Başvuru Özeti Oluştur</button>
        </form>
        
        <div id="sonucAlani" class="mt-4">
            </div>
    </div>

    <footer class="text-center py-4 text-muted">
        <p>© 2026 - Arda Sarıoğlu | Web Programlama Dersi</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="hafta7.js"></script>
</body>
</html>
